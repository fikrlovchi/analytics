server {
    listen 80;
    server_name analytics.fikrlovchi.uz;

    client_max_body_size 15m;   # fon rasmlarini yuklash uchun

    location / {
        proxy_pass http://127.0.0.1:4043;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# TLS (certbot o'rnatgach avtomatik 443 blokini qo'shadi):
#   sudo certbot --nginx -d analytics.fikrlovchi.uz
# So'ng .env da COOKIE_SECURE=true va: systemctl restart analytics
